[project]
name = "enc-ft"
version = "0.1.0"
description = "エンコーダのみモデル(日本語)の感情分類ファインチューニング 学習プロジェクト"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.7",          # Blackwell(sm_120) は 2.7 以降 + cu128 ビルドが必須
    "transformers>=4.48",  # ModernBert* を含むバージョン
    "datasets>=2.19",      # 本プロジェクトはスクリプト方式を使わない(from_pandas 中心)
    "accelerate>=0.30",    # Trainer が内部で利用
    "scikit-learn>=1.3",   # 評価指標(F1/混同行列)
    "pandas>=2.0",         # WRIME TSV の前処理
    "numpy>=1.24",
    "matplotlib>=3.7",     # 混同行列の可視化(任意)
    "sentencepiece>=0.1.99",
]

# tohoku BERT(classic BERT)を試すとき用の任意依存。既定では入れない。
#   uv sync --extra tohoku
[project.optional-dependencies]
tohoku = [
    "fugashi>=1.3",
    "unidic-lite>=1.0.8",
]
# ONNX エクスポート(Unity Sentis 等へ配備)用の任意依存。
#   uv sync --extra onnx
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18,<1.21",  # Python 3.10 用 wheel がある版に固定(新しめは cp311+ のみ)
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/enc_ft"]

# ---- PyTorch を Blackwell 対応 cu128 ビルドから取得する設定 ----
# torch だけを PyTorch 公式インデックスへ向ける(explicit=true)。
# 他パッケージは通常どおり PyPI から解決される。
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
